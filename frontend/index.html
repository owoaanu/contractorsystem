  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      const errDiv = document.createElement('div');
      errDiv.style = "position: fixed; top: 0; left: 0; background: red; color: white; z-index: 999999; padding: 20px; width: 100%; white-space: pre-wrap;";
      errDiv.textContent = 'GLOBAL ERROR: ' + message + '\n\n' + (error ? error.stack : '');
      document.body.appendChild(errDiv);
    };
    window.addEventListener('unhandledrejection', function(event) {
      const errDiv = document.createElement('div');
      errDiv.style = "position: fixed; top: 0; left: 0; background: red; color: white; z-index: 999999; padding: 20px; width: 100%; white-space: pre-wrap;";
      errDiv.textContent = 'PROMISE REJECTION: ' + (event.reason ? event.reason.stack : event.reason);
      document.body.appendChild(errDiv);
    });
  </script>
