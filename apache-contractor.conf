# ==============================================================================
# Apache 2.4 Reverse Proxy Configuration Snippet
# Edo State University Contractor Registration Portal
# Path: /contractor
# ==============================================================================
#
# PREREQUISITES:
# Ensure the required Apache modules are enabled:
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers
#   sudo systemctl restart apache2
#
# IMPORTANT:
# In your existing VirtualHost configuration file (e.g. in /etc/apache2/sites-available/),
# place this entire /contractor configuration block BEFORE your ASP.NET Core catch-all
# 'ProxyPass / http://localhost:5000/' rule!
#
# ==============================================================================

<VirtualHost *:443>
    ServerName yourdomain.edu.ng

    # --------------------------------------------------------------------------
    # 1. Socket.IO WebSockets Proxy (/contractor/socket.io)
    # --------------------------------------------------------------------------
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/contractor/socket\.io/(.*) ws://127.0.0.1:3000/socket.io/$1 [P,L]

    ProxyPass /contractor/socket.io/ ws://127.0.0.1:3000/socket.io/
    ProxyPassReverse /contractor/socket.io/ ws://127.0.0.1:3000/socket.io/

    # --------------------------------------------------------------------------
    # 2. Contractor System Proxy (Static SPA, API endpoints, and Uploads)
    # --------------------------------------------------------------------------
    ProxyPreserveHost On
    ProxyRequests Off

    <Location /contractor>
        ProxyPass http://127.0.0.1:3000/contractor
        ProxyPassReverse http://127.0.0.1:3000/contractor
        
        # Allow document uploads (up to 50MB) and prevent proxy timeouts
        LimitRequestBody 52428800
        ProxyTimeout 300
    </Location>

    # --------------------------------------------------------------------------
    # 3. Existing ASP.NET Core MVC Application (Root /)
    #    (Keep this below the /contractor rules)
    # --------------------------------------------------------------------------
    ProxyPass / http://localhost:5000/
    ProxyPassReverse / http://localhost:5000/

</VirtualHost>
